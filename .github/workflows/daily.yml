name: daily-jobfeed

on:
  schedule:
    # GitHub Actions 的 cron 按 UTC 算：0 0 * * * = 每天北京时间 08:00
    - cron: "0 0 * * *"
  workflow_dispatch:          # 允许在 Actions 页手动点按钮触发

permissions:
  contents: write             # 要把日报和 state.json 提交回仓库，必须给写权限

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        # 从 pyproject.toml / uv.lock 安装，不手写包清单。
        # 教程原版写的是 pip install httpx pydantic python-dotenv openpyxl，
        # 漏了 openai，会在运行 extract.py 时报 ModuleNotFoundError。
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --frozen

      - name: 运行
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_MODEL: deepseek-chat
          LLM_BASE_URL: https://api.deepseek.com
        run: uv run python main.py

      - name: 上传结果（便于人工检查）
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: output/

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output state.json
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: 更新岗位日报 $(date -u +%F)"
            git push
          fi
